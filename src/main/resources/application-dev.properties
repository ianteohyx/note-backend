# ========================
# Dev Profile
# ========================

# Show SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Auto-update schema on startup
spring.jpa.hibernate.ddl-auto=update

# Verbose logging
logging.level.com.yx.note_app=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS
cors.allowed-origins=http://localhost:5173

# Refresh token cookie — dev-friendly: no HTTPS locally, and localhost:5173 -> localhost:8080
# is same-site, so Lax works for the browser and the cookie is also sent by Postman over http.
jwt.refresh-cookie.secure=false
jwt.refresh-cookie.same-site=Lax

# Swagger UI enabled (default, no override needed)
