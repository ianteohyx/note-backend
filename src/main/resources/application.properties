spring.application.name=note-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT
jwt.secret=${JWT_SECRET}
jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Refresh token cookie (HttpOnly cookie that carries the refresh token to the browser)
# Defaults suit a cross-site HTTPS deployment; the dev/prod profiles override secure & same-site.
jwt.refresh-cookie.path=${REFRESH_COOKIE_PATH:/api/users}
jwt.refresh-cookie.secure=true
jwt.refresh-cookie.same-site=None

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

