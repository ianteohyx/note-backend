# Production compose file — backend + frontend, pulled as pre-built images.
# No `db` service: the database is AWS RDS, reached over the network via
# DB_URL below, not a local container. No `build:` anywhere either — CI
# builds and pushes both images; this server only ever pulls them, so it
# never needs either repo's source checked out.
#
# BACKEND_IMAGE / FRONTEND_IMAGE: set these once CI is wired up to push to a
# registry (not done yet — see docker/production-deployment.html for the
# plan). Until then they fall back to a local image name, which only works
# if you've built that tag on this machine yourself.
#
# Usage on the server (env vars already exported per CLAUDE.md "Environment
# Variables" — no .env file needed, though one is picked up if present):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# pull_policy: missing on both services below is deliberate, matching the
# two-step usage above: `pull` is the one explicit step that fetches a
# fresh image, so `up -d` should just run whatever's already local instead
# of silently re-pulling (and hard-failing if the registry is briefly
# unreachable, or — before CI/a registry exist yet — if the tag isn't
# published anywhere but is already built locally).
#
# Always reference this file explicitly with -f. Do not rely on a bare
# `docker compose up`, which auto-merges docker-compose.override.yml (if one
# ever exists in this directory) and could bring up services you don't want here.

services:
  app:
    image: ${BACKEND_IMAGE:-note-backend-app:latest}
    pull_policy: missing
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Full RDS JDBC URL, e.g. jdbc:mysql://<rds-endpoint>:3306/i-note-db
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      cors.allowed-origins: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Optional — application-prod.properties already defaults these correctly
      # (Path=/api/users, Secure=true, SameSite=None). Only set them on the host
      # if you need to override.
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/users}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-None}
    ports:
      - "8080:8080"

  web:
    image: ${FRONTEND_IMAGE:-inote-frontend:latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # No BACKEND_URL override needed: unlike the standalone dev container,
    # this service shares a compose network with `app`, so the frontend
    # image's own default (http://app:8080) already resolves correctly —
    # same mechanism verified on the dev stack earlier.
    ports:
      - "80:8080"
