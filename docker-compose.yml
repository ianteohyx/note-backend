services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - note_db_data:/var/lib/mysql
    healthcheck:
      # Deliberately NOT a plain `mysqladmin ping` — MySQL's startup runs a
      # brief internal bootstrap server first (to create users/run init
      # scripts) before restarting into the real one. A plain ping can
      # succeed against that temporary server, reporting "healthy" just
      # before a restart `app` would then race against. Querying as the
      # actual app user against the actual app database only succeeds once
      # the final server is up AND the user/grants exist, which is exactly
      # what `app` itself needs.
      test: ["CMD-SHELL", "mysql -u ${DB_USERNAME} -p${DB_PASSWORD} -e 'SELECT 1' ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # NOTE: hostname is the compose service name `db`, not localhost —
      # containers reach each other by service name on the compose network.
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  note_db_data:
